      - employeeNumber
      - worksiteCode
      - worksiteZoneId
      - entryTime
      - workTime
      properties:
        employeeNumber:
          type: string
          description: Stable employee identifier used by canonical employee routes.
        worksiteCode:
          type: string
        worksiteZoneId:
          type: string
        entryTime:
          type: string
          format: date-time
        exitTime:
          type: string
          format: date-time
          nullable: true
        workTime:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/DurationResponse'
    WorksitePage:
      type: object
      required:
      - content
      - page
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/WorksiteResponse'
        page:
          $ref: '#/components/schemas/PageMetadata'
    SchedulePage:
      type: object
      required:
      - content
      - page
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ScheduleSummaryResponse'
        page:
          $ref: '#/components/schemas/PageMetadata'
    TimeLogPage:
      type: object
      required:
      - content
      - page
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/TimeLogResponse'
        page:
          $ref: '#/components/schemas/PageMetadata'
    CreateTimeLogRequest:
      type: object
      required:
      - entryTime
      - exitTime
      properties:
        entryTime: &id006
          type: string
          format: date-time
        exitTime: *id006
    TransitionClockOutWithoutClockInEventRequest:
      type: object
      description: A RESOLVE action requires entryTime; an INVALIDATE action forbids entryTime.
      required:
      - action
      properties:
        action:
          type: string
          enum: [RESOLVE, INVALIDATE]
        entryTime: *id006
        reason:
          type: string
          maxLength: 255
          pattern: "^[^\\x00]*$"
    ClockOutWithoutClockInEventResponse:
      type: object
      required:
      - employeeNumber
      - worksiteCode
      - exitTime
      - detectedAt
      - resolved
      - invalidated
      properties:
        employeeNumber:
          type: string
          description: Stable employee identifier used by canonical employee routes.
        worksiteCode:
          type: string
        exitTime: *id006
        detectedAt: *id006
        resolved:
          type: boolean
        invalidated:
          type: boolean
        reason:
          type: string
        resolvedTimeLogEntry: *id006
        resolvedTimeLogExitTime: *id006
