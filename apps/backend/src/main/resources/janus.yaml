openapi: 3.0.3
info:
  title: Janus API
  version: 1.0.0
servers:
- url: /api/v1
paths:
  /employees:
    get:
      tags:
      - employees
      operationId: searchEmployees
      parameters:
      - name: query
        in: query
        schema:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '^[\p{L}\p{M}\p{N}\p{Zs}\p{P}\p{S}]+$'
      - name: scheduleCode
        in: query
        schema:
          type: string
          pattern: '^[A-Za-z0-9_-]{1,50}$'
          minLength: 1
          maxLength: 50
      - name: worksiteCode
        in: query
        schema:
          type: string
          pattern: '^[A-Za-z0-9_-]{1,50}$'
          minLength: 1
          maxLength: 50
      - name: page
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: size
        in: query
        schema:
          type: integer
          minimum: 1
          default: 20
      - name: sort
        in: query
        description: Sort criteria; defaults to employeeNumber,asc.
        schema:
          type: array
          default: ['employeeNumber,asc']
          items:
            type: string
        style: form
        explode: true
      responses:
        '200':
          description: Page of employees matching the filters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeePage'
    post:
      tags:
      - employees
      operationId: createEmployee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEmployeeRequest'
      responses:
        '201':
          description: Created employee
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeResponse'
  /employees/{employeeNumber}:
    parameters:
    - name: employeeNumber
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/EmployeeNumber'
    get:
      tags:
      - employees
      operationId: findEmployee
      responses:
        '200':
          description: Employee
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeResponse'
    put:
      tags:
      - employees
      operationId: updateEmployee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEmployeeRequest'
      responses:
        '200':
          description: Updated employee
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeResponse'
    delete:
      tags:
      - employees
      operationId: deleteEmployee
      responses:
        '204':
          description: Employee deleted
  /app-users:
    get:
      tags: [app-users]
      operationId: searchAppUsers
      description: Requires JANUS_ADMIN and a provisioned profile. Missing filters list all profiles, including those without an employee. Filters combine with AND.
      security:
      - bearerAuth: []
      parameters:
      - name: email
        in: query
        description: Literal, case-insensitive partial email match without trimming. SQL wildcards are treated literally. Missing or empty values disable this filter.
        schema:
          type: string
          maxLength: 254
      - name: employeeNumber
        in: query
        description: "Exact, case-sensitive employee number without trimming surrounding whitespace; must match ^[A-Za-z0-9_-]{1,50}$."
        schema:
          $ref: '#/components/schemas/EmployeeNumber'
      - name: page
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: size
        in: query
        description: Values above spring.data.rest.max-page-size are capped at that configured limit (100 by default).
        schema:
          type: integer
          minimum: 1
          default: 20
      - name: sort
        in: query
        description: Allowed fields are id, email and employeeNumber. Defaults to email,asc. An ascending UUID tie-breaker is appended unless id is explicitly sorted. Unknown fields return 400.
        schema:
          type: array
          default: ['email,asc']
          items:
            type: string
        style: form
        explode: true
      responses:
        '200':
          description: Page of application users matching the filters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppUserPage'
        '400':
          description: Invalid filter or unsupported sort field
        '401':
          description: Authentication required
        '403':
          description: Requires a provisioned administrator
  /app-users/me:
    get:
      tags: [app-users]
      operationId: findCurrentAppUser
      description: Requires a validated JWT with a recognized Janus role and verified email. Finds or provisions the profile by opaque subject; refreshes contact email without changing an existing employee association.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Current application user with configured initial preferences on first access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppUserResponse'
        '400':
          description: Missing or invalid email, oversized subject, or malformed employeeNumber claim
        '401':
          description: Missing or invalid bearer token, including unverified email
        '403':
          description: No recognized Janus role
  /app-users/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    put:
      tags: [app-users]
      operationId: updateAppUser
      description: A provisioned JANUS_ADMIN may edit any profile. JANUS_USER and JANUS_EMPLOYEE may edit only their own profile. Only preferences change; email, subject and employee association are preserved.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAppUserRequest'
      responses:
        '200':
          description: Updated application user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppUserResponse'
        '400':
          description: Invalid UUID or preferences
        '401':
          description: Authentication required
        '403':
          description: Unprovisioned identity or insufficient permissions
        '404':
          description: Application user not found
    delete:
      tags: [app-users]
      operationId: deleteAppUser
      description: Requires a provisioned JANUS_ADMIN. Deletes the local profile and preserves the employee and Keycloak account.
      security:
      - bearerAuth: []
      responses:
        '204':
          description: Application user deleted
        '400':
          description: Invalid UUID
        '401':
          description: Authentication required
        '403':
          description: Unprovisioned identity or insufficient permissions
        '404':
          description: Application user not found
  /application-settings:
    get:
      tags:
      - application-settings
      operationId: findApplicationSettings
      description: Read the single global configuration. Requires a provisioned JWT identity with JANUS_EMPLOYEE, JANUS_USER or JANUS_ADMIN.
      responses:
        '200':
          description: Current application settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationSettingsResponse'
        '401':
          description: Valid authentication credentials are required
        '403':
          description: Identity is not provisioned or has no permitted role
        '500':
          description: Global settings row is missing or an unexpected internal error occurred
    put:
      tags:
      - application-settings
      operationId: updateApplicationSettings
      description: Replace all five settings. Requires a provisioned JWT identity with JANUS_ADMIN. All fields are required; obsolete property names are not aliases.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateApplicationSettingsRequest'
      responses:
        '200':
          description: Updated application settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationSettingsResponse'
        '400':
          description: Invalid or incomplete settings payload
        '401':
          description: Valid authentication credentials are required
        '403':
          description: Identity is not provisioned or is not an administrator
        '500':
          description: Global settings row is missing or an unexpected internal error occurred
  /worksites:
    get:
      tags:
      - worksites
      operationId: searchWorksites
      parameters:
      - name: query
        in: query
        schema:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '^[\p{L}\p{M}\p{N}\p{Zs}\p{P}\p{S}]+$'
      - name: employeeNumber
        in: query
        schema:
          $ref: '#/components/schemas/EmployeeNumber'
      - name: page
        in: query
        schema:
          type: integer
          default: 0
      - name: size
        in: query
        description: Values above spring.data.rest.max-page-size are capped at that configured limit (100 by default).
        schema:
          type: integer
          default: 20
      - name: sort
        in: query
        description: Sort by code, name, timeZone, scope, description or address. Ascending code breaks ties unless code is explicitly ordered.
        schema:
          type: array
          default: ['code,asc']
          items:
            type: string
        style: form
        explode: true
      responses:
        '400':
          description: Invalid query, employee number or unsupported sort field.
        '403':
          description: Employee association missing, employee filter outside the authorized scope, or actor without a permitted role.
        '200':
          description: Paginated worksites
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorksitePage'
    post:
      tags:
      - worksites
      operationId: createWorksite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorksiteRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorksiteResponse'
  /worksites/{worksiteCode}:
    parameters:
    - name: worksiteCode
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{1,50}$'
        minLength: 1
        maxLength: 50
    get:
      tags:
      - worksites
      operationId: findWorksite
      responses:
        '200':
          description: Worksite
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorksiteResponse'
    put:
      tags:
      - worksites
      operationId: updateWorksite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWorksiteRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorksiteResponse'
    delete:
      tags:
      - worksites
      operationId: deleteWorksite
      responses:
        '204':
          description: Deleted
  /worksites/{worksiteCode}/stats:
    parameters:
    - name: worksiteCode
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{1,50}$'
        minLength: 1
        maxLength: 50
    - name: start
      in: query
      required: true
      description: Inclusive lower bound of the half-open interval [start, end).
      schema:
        type: string
        format: date-time
    - name: end
      in: query
      required: true
      description: Exclusive upper bound of the half-open interval [start, end).
      schema:
        type: string
        format: date-time
    get:
      tags:
      - worksites
      operationId: stats
      responses:
        '200':
          description: Worksite statistics for the requested interval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorksiteStatsResponse'
  /schedules:
    get:
      tags:
      - schedules
      operationId: searchSchedules
      parameters:
      - name: query
        in: query
        schema:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '^[\p{L}\p{M}\p{N}\p{Zs}\p{P}\p{S}]+$'
      - name: employeeNumber
        in: query
        schema:
          $ref: '#/components/schemas/EmployeeNumber'
      - name: page
        in: query
        schema:
          type: integer
          default: 0
      - name: size
        in: query
        schema:
          type: integer
          default: 20
      - name: sort
        in: query
        schema:
          type: array
          default: ['code,asc']
          items:
            type: string
        style: form
        explode: true
      responses:
        '403':
          description: Employee association missing, employee filter outside the authorized scope, or actor without a permitted role.
        '200':
          description: Paginated schedule summaries without rules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulePage'
    post:
      tags:
      - schedules
      operationId: createSchedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateScheduleRequest'
      responses:
        '201':
          description: Created schedule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleResponse'
  /schedules/{scheduleCode}:
    parameters:
    - name: scheduleCode
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{1,50}$'
        minLength: 1
        maxLength: 50
    get:
      tags: [schedules]
      operationId: findSchedule
      responses:
        '200':
          description: Schedule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleResponse'
    put:
      tags: [schedules]
      operationId: updateSchedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateScheduleRequest'
      responses:
        '200':
          description: Updated schedule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleResponse'
    delete:
      tags: [schedules]
      operationId: deleteSchedule
      responses:
        '204':
          description: Schedule deleted
  /catalogs/time-zones:
    get:
      tags: [catalogs]
      operationId: searchTimeZones
      parameters:
      - name: query
        in: query
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '^[\p{L}\p{M}\p{N}\p{Zs}\p{P}\p{S}]+$'
      - name: page
        in: query
        required: false
        schema:
          type: integer
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          default: 20
      - name: sort
        in: query
        required: false
        description: 'Sorting criteria. Supported properties: level1, level2, utc.'
        schema:
          type: array
          items:
            type: string
            pattern: '^(level1|level2|utc)(,(asc|desc))?$'
          default: ['level1,asc']
        style: form
        explode: true
      responses:
        '200':
          description: Paginated time-zone catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeZoneCatalogPage'
  /time-logs:
    get:
      tags:
      - time-logs
      operationId: searchTimeLogs
      description: The start and end time-range bounds must be provided together or both omitted. When present, start must be before end.
      parameters:
      - name: employeeNumber
        in: query
        schema:
          $ref: '#/components/schemas/EmployeeNumber'
      - name: start
        in: query
        description: Inclusive lower bound of the half-open interval [start, end). Must be provided together with end.
        schema:
          type: string
          format: date-time
      - name: end
        in: query
        description: Exclusive upper bound of the half-open interval [start, end). Must be provided together with start and be after it.
        schema:
          type: string
          format: date-time
      - name: page
        in: query
        schema:
          type: integer
          default: 0
      - name: size
        in: query
        schema:
          type: integer
          default: 20
      - name: sort
        in: query
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
      responses:
        '403':
          description: Employee association missing, employee filter outside the authorized scope, or actor without a permitted role.
        '200':
          description: Paginated time logs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeLogPage'
  /employees/{employeeNumber}/time-logs/clock-in:
    post:
      tags:
      - time-logs
      operationId: clockIn
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeLogResponse'
      parameters:
      - &id001
        name: employeeNumber
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/EmployeeNumber'
      - &id002
        name: worksiteCode
        in: query
        required: true
        schema:
          type: string
          pattern: '^[A-Za-z0-9_-]{1,50}$'
          minLength: 1
          maxLength: 50
      - name: entryTime
        in: query
        schema:
          type: string
          format: date-time
  /employees/{employeeNumber}/time-logs/clock-out:
    post:
      tags:
      - time-logs
      operationId: clockOut
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeLogResponse'
      parameters:
      - *id001
      - *id002
      - name: exitTime
        in: query
        schema:
          type: string
          format: date-time
  /employees/{employeeNumber}/time-logs:
    post:
      tags:
      - time-logs
      operationId: createTimeLog
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeLogResponse'
      parameters:
      - *id001
      - *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTimeLogRequest'
  /employees/{employeeNumber}/time-logs/{entryTime}:
    parameters:
    - *id001
    - name: entryTime
      in: path
      required: true
      schema:
        type: string
        format: date-time
    get:
      tags:
      - time-logs
      operationId: findTimeLogByEmployeeAndEntryTime
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeLogResponse'
    delete:
      tags:
      - time-logs
      operationId: deleteTimeLog
      responses:
        '204':
          description: No content
  /employees/{employeeNumber}/worksites/{worksiteCode}/clock-out-without-clock-in-events/{exitTime}:
    parameters: &id003
    - *id001
    - name: worksiteCode
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{1,50}$'
        minLength: 1
        maxLength: 50
    - name: exitTime
      in: path
      required: true
      schema:
        type: string
        format: date-time
    get:
      tags:
      - clock-out-without-clock-in-events
      operationId: findClockOutWithoutClockInEvent
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClockOutWithoutClockInEventResponse'
    patch:
      tags:
      - clock-out-without-clock-in-events
      operationId: transitionClockOutWithoutClockInEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransitionClockOutWithoutClockInEventRequest'
      responses:
        '200':
          description: Event transitioned to its requested final state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClockOutWithoutClockInEventResponse'
  /worksites/{worksiteCode}/employees/{employeeNumber}:
    parameters:
    - name: worksiteCode
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{1,50}$'
        minLength: 1
        maxLength: 50
    - *id001
    put:
      tags:
      - worksites
      operationId: assignEmployeeToWorksite
      responses:
        '204':
          description: No content
    delete:
      tags:
      - worksites
      operationId: removeEmployeeFromWorksite
      responses:
        '204':
          description: Employee removed from the worksite; no content is returned.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    EmployeeNumber:
      type: string
      pattern: '^[A-Za-z0-9_-]{1,50}$'
      minLength: 1
      maxLength: 50
      description: Stable employee identifier containing 1 to 50 letters, digits, underscores, or hyphens.
    WorksiteCode:
      type: string
      pattern: '^[A-Za-z0-9_-]{1,50}$'
      minLength: 1
      maxLength: 50
      description: Stable worksite code containing 1 to 50 letters, digits, underscores, or hyphens.
    ScheduleCode:
      type: string
      pattern: '^[A-Za-z0-9_-]{1,50}$'
      minLength: 1
      maxLength: 50
      description: Stable schedule code containing 1 to 50 letters, digits, underscores, or hyphens.
    EmployeeResponse:
      type: object
      required:
      - employeeNumber
      - name
      - surname
      - email
      - scheduleCode
      properties:
        employeeNumber:
          $ref: '#/components/schemas/EmployeeNumber'
        name:
          type: string
        surname:
          type: string
        email:
          type: string
          format: email
        scheduleCode:
          $ref: '#/components/schemas/ScheduleCode'
    EmployeePage:
      type: object
      required:
      - content
      - page
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/EmployeeResponse'
        page:
          $ref: '#/components/schemas/PageMetadata'
    CreateEmployeeRequest:
      type: object
      required:
      - employeeNumber
      - name
      - surname
      - email
      - scheduleCode
      properties:
        employeeNumber:
          $ref: '#/components/schemas/EmployeeNumber'
        name:
          type: string
          pattern: "^[\\p{L} .,'-]{1,255}$"
          maxLength: 255
        surname:
          type: string
          pattern: "^[\\p{L} .,'-]{1,255}$"
          maxLength: 255
        email:
          type: string
          format: email
          maxLength: 254
        scheduleCode:
          $ref: '#/components/schemas/ScheduleCode'
    UpdateEmployeeRequest:
      type: object
      required:
      - name
      - surname
      - email
      - scheduleCode
      properties:
        name:
          type: string
          pattern: "^[\\p{L} .,'-]{1,255}$"
          maxLength: 255
        surname:
          type: string
          pattern: "^[\\p{L} .,'-]{1,255}$"
          maxLength: 255
        email:
          type: string
          format: email
          maxLength: 254
        scheduleCode:
          $ref: '#/components/schemas/ScheduleCode'
    Theme:
      type: string
      enum:
      - DARK
      - LIGHT
      default: DARK
    TimeFormat:
      type: string
      enum:
      - H12
      - H24
    AppUserPage:
      type: object
      required: [content, page]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/AppUserResponse'
        page:
          $ref: '#/components/schemas/PageMetadata'
    AppUserResponse:
      type: object
      required:
      - id
      - email
      - locale
      - timeFormat
      - defaultTimezone
      - theme
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        employeeNumber:
          $ref: '#/components/schemas/EmployeeNumber'
        locale:
          type: string
        timeFormat:
          $ref: '#/components/schemas/TimeFormat'
        theme:
          $ref: '#/components/schemas/Theme'
        defaultTimezone:
          type: string
    UpdateAppUserRequest:
      type: object
      required:
      - locale
      - timeFormat
      - defaultTimezone
      - theme
      properties:
        locale:
          type: string
          description: Supported BCP 47 language tag, such as en-US or en
          maxLength: 64
        timeFormat:
          $ref: '#/components/schemas/TimeFormat'
        theme:
          $ref: '#/components/schemas/Theme'
        defaultTimezone:
          type: string
          minLength: 1
          maxLength: 64
    ApplicationSettingsResponse:
      type: object
      required:
      - daysUntilLocked
      - employeeWorksiteCreationAllowed
      - worksiteChangeDuringShiftAllowed
      - employeeManualTimeLogEntryAllowed
      - defaultTimezone
      properties:
        daysUntilLocked:
          type: integer
          minimum: 0
          description: Modification window in days; also controls work shift lookup and precomputation.
        employeeWorksiteCreationAllowed:
          type: boolean
          description: Whether employees can create personal worksites.
        worksiteChangeDuringShiftAllowed:
          type: boolean
          description: Whether clock-out may use a different worksite from clock-in.
        employeeManualTimeLogEntryAllowed:
          type: boolean
          description: Whether employees can supply explicit time log timestamps.
        defaultTimezone:
          type: string
          description: Stored global zone accepted by Java ZoneId, including UTC and offsets. Surrounding input spaces are trimmed. Does not override worksite or account zones.
    UpdateApplicationSettingsRequest:
      type: object
      required:
      - daysUntilLocked
      - employeeWorksiteCreationAllowed
      - worksiteChangeDuringShiftAllowed
      - employeeManualTimeLogEntryAllowed
      - defaultTimezone
      properties:
        daysUntilLocked:
          type: integer
          minimum: 0
          description: Modification window in days; also controls work shift lookup and precomputation.
        employeeWorksiteCreationAllowed:
          type: boolean
          description: Whether employees can create personal worksites. Obsolete input names do not satisfy this required field.
        worksiteChangeDuringShiftAllowed:
          type: boolean
          description: Whether clock-out may use a different worksite from clock-in.
        employeeManualTimeLogEntryAllowed:
          type: boolean
          description: Whether employees can supply explicit time log timestamps. Obsolete input names do not satisfy this required field.
        defaultTimezone:
          type: string
          description: Stored global zone accepted by Java ZoneId, including UTC and offsets. Surrounding input spaces are trimmed. Does not override worksite or account zones.
          minLength: 1
          maxLength: 64
    PageMetadata:
      type: object
      required:
      - size
      - number
      - totalElements
      - totalPages
      properties:
        size:
          type: integer
        number:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
    WorksiteScope:
      type: string
      enum:
      - GLOBAL
      - ASSIGNED
    WorksiteResponse:
      type: object
      required:
      - code
      - name
      - timeZone
      - scope
      - active
      properties:
        code:
          $ref: '#/components/schemas/WorksiteCode'
        name:
          type: string
        timeZone:
          type: string
        scope:
          $ref: '#/components/schemas/WorksiteScope'
        description:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        active:
          type: boolean
    CreateWorksiteRequest:
      type: object
      required:
      - code
      - name
      - timeZone
      - scope
      properties:
        code:
          $ref: '#/components/schemas/WorksiteCode'
        name:
          type: string
          pattern: "^[\\p{L}0-9 _'.,-]{1,250}$"
          maxLength: 250
        timeZone:
          type: string
          pattern: "^[A-Za-z0-9_./+:-]{1,64}$"
          maxLength: 64
        scope:
          $ref: '#/components/schemas/WorksiteScope'
        description:
          type: string
          nullable: true
          pattern: "^[^\\x00]*$"
          maxLength: 500
        address:
          type: string
          nullable: true
          pattern: "^[^\\x00]*$"
          maxLength: 500
    UpdateWorksiteRequest:
      type: object
      required:
      - name
      - timeZone
      - scope
      properties:
        name:
          type: string
          pattern: "^[\\p{L}0-9 _'.,-]{1,250}$"
          maxLength: 250
        timeZone:
          type: string
          pattern: "^[A-Za-z0-9_./+:-]{1,64}$"
          maxLength: 64
        scope:
          $ref: '#/components/schemas/WorksiteScope'
        description:
          type: string
          nullable: true
          pattern: "^[^\\x00]*$"
          maxLength: 500
        address:
          type: string
          nullable: true
          pattern: "^[^\\x00]*$"
          maxLength: 500
    ScheduleSummaryResponse:
      type: object
      required:
      - code
      - name
      - entryTolerance
      - exitTolerance
      properties:
        code:
          $ref: '#/components/schemas/ScheduleCode'
        name:
          type: string
        entryTolerance:
          type: string
        exitTolerance:
          type: string
    ScheduleResponse:
      type: object
      required:
      - code
      - name
      - entryTolerance
      - exitTolerance
      properties:
        code:
          $ref: '#/components/schemas/ScheduleCode'
        name:
          type: string
        entryTolerance:
          type: string
        exitTolerance:
          type: string
        rules:
          type: array
          items:
            type: object
            additionalProperties: true
    CreateScheduleRequest:
      type: object
      required: [code, name, entryTolerance, exitTolerance, rules]
      properties:
        code:
          $ref: '#/components/schemas/ScheduleCode'
        name:
          type: string
          pattern: "^[\\p{L}0-9 _'.,-]{1,250}$"
          maxLength: 250
        entryTolerance:
          type: string
          format: duration
          pattern: '^P(?!-).*$'
        exitTolerance:
          type: string
          format: duration
          pattern: '^P(?!-).*$'
        rules:
          type: array
          items:
            $ref: '#/components/schemas/ScheduleRuleRequest'
    UpdateScheduleRequest:
      type: object
      required: [name, entryTolerance, exitTolerance, rules]
      properties:
        name:
          type: string
          pattern: "^[\\p{L}0-9 _'.,-]{1,250}$"
          maxLength: 250
        entryTolerance:
          type: string
          format: duration
          pattern: '^P(?!-).*$'
        exitTolerance:
          type: string
          format: duration
          pattern: '^P(?!-).*$'
        rules:
          type: array
          items:
            $ref: '#/components/schemas/ScheduleRuleRequest'
    ScheduleRuleRequest:
      type: object
      required: [name, dayOfWeekRanges]
      description: startDate must be on or before endDate when both are supplied.
      properties:
        name:
          type: string
          pattern: "^[\\p{L}0-9 _'.,-]{1,250}$"
          maxLength: 250
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        dayOfWeekRanges:
          type: array
          items:
            $ref: '#/components/schemas/ScheduleRuleTimeRangeRequest'
    ScheduleRuleTimeRangeRequest:
      type: object
      required: [dayOfWeek, effectiveWorkHours, timeRange]
      description: effectiveWorkHours must be non-negative and no longer than timeRange.
      properties:
        dayOfWeek:
          type: string
          enum: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY]
        effectiveWorkHours:
          type: string
          format: duration
          pattern: '^P(?!-).*$'
        timeRange:
          $ref: '#/components/schemas/ScheduleTimeRangeRequest'
    ScheduleTimeRangeRequest:
      type: object
      required: [startTime, endTime]
      description: endTime must be after startTime.
      properties:
        startTime:
          type: string
          format: time
        endTime:
          type: string
          format: time
    WorksiteStatsResponse:
      type: object
      required: [worksiteCode, start, end, employeesWhoClockedIn, erroneousTimeLogs,
        totalTimeLogs, employeesAllowedToClockIn, distinctSchedulesFromEmployeesWhoClockedIn]
      properties:
        worksiteCode:
          type: string
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        employeesWhoClockedIn:
          type: integer
          format: int64
        erroneousTimeLogs:
          type: integer
          format: int64
        totalTimeLogs:
          type: integer
          format: int64
        employeesAllowedToClockIn:
          type: integer
          format: int64
        distinctSchedulesFromEmployeesWhoClockedIn:
          type: integer
          format: int64
    TimeZoneCatalogItemResponse:
      type: object
      required: [literal, level1, utc]
      properties:
        literal:
          type: string
        level1:
          type: string
        level2:
          type: string
          nullable: true
        utc:
          type: string
    TimeZoneCatalogPage:
      type: object
      required: [content, page]
      properties:
        content:
          type: array
