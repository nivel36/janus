@if (routerLink(); as destination) {
  <a [class]="buttonClass" [routerLink]="destination" [attr.aria-label]="ariaLabel()">
    <span class="app-button__label">
      <ng-content></ng-content>
    </span>
  </a>
} @else {
  <button
    [class]="buttonClass"
    [type]="type()"
    [attr.aria-label]="ariaLabel()"
    [disabled]="disabled()"
    (click)="clicked.emit($event)"
  >
    <span class="app-button__label">
      <ng-content></ng-content>
    </span>
  </button>
}
