<app-page-template appNameKey="navigation.janus" pageNameKey="navigation.userPreferences">
  <div pageContent class="app-page-content user-preferences">
    <section class="app-card preferences-card">
      <div class="app-card__body preferences-card__body">
        <app-form
          [form]="form"
          [save]="save"
          saveErrorKey="userPreferences.errors.update"
          [errorKey]="errorMessage()"
          [disabled]="loading() || !!errorMessage()"
          cancelLink="/"
          (saved)="onSaved($event)"
        >
          <app-field
            controlId="preferences-locale"
            [label]="'userPreferences.fields.locale' | translate"
            required
          >
            <app-select
              inputId="preferences-locale"
              [formControl]="form.controls.locale"
              [options]="localeOptions"
              required
            />
          </app-field>

          <app-field
            controlId="preferences-time-format"
            [label]="'userPreferences.fields.timeFormat' | translate"
            required
          >
            <app-select
              inputId="preferences-time-format"
              [formControl]="form.controls.timeFormat"
              [options]="timeFormatOptions"
              required
            />
          </app-field>

          <app-field
            controlId="preferences-timezone"
            [label]="'userPreferences.fields.defaultTimezone' | translate"
            [error]="
              form.controls.defaultTimezone.touched && form.controls.defaultTimezone.invalid
                ? ('userPreferences.errors.invalidTimezone' | translate)
                : ''
            "
            [invalid]="
              form.controls.defaultTimezone.touched && form.controls.defaultTimezone.invalid
            "
            required
          >
            <app-autocomplete-textbox
              appAutocompleteValueAccessor
              inputId="preferences-timezone"
              [formControl]="form.controls.defaultTimezone"
              [items]="timezoneSearch.items()"
              [loading]="timezoneSearch.loading()"
              [error]="timezoneSearch.error()"
              [panelOpen]="timezoneSearch.panelOpen()"
              (queryChange)="timezoneSearch.search($event)"
              [displayWith]="timezoneCatalog.displayWith"
              [valueWith]="timezoneCatalog.valueWith"
              [resolveByValue]="timezoneCatalog.resolve"
              [emptyHint]="'userPreferences.fields.defaultTimezoneHint' | translate"
              ariaLabelledBy="preferences-timezone-label"
              [ariaDescribedBy]="
                form.controls.defaultTimezone.touched && form.controls.defaultTimezone.invalid
                  ? 'preferences-timezone-error'
                  : null
              "
              [ariaInvalid]="
                form.controls.defaultTimezone.touched && form.controls.defaultTimezone.invalid
              "
            />
          </app-field>

          <app-field
            controlId="preferences-theme"
            [label]="'userPreferences.fields.theme' | translate"
            required
          >
            <app-select
              inputId="preferences-theme"
              [formControl]="form.controls.theme"
              [options]="themeOptions"
              required
            />
          </app-field>
        </app-form>
      </div>
    </section>
  </div>
</app-page-template>
