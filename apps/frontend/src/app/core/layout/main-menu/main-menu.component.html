@if (user(); as user) {
  <nav class="main-menu" [attr.aria-label]="'navigation.mainMenu' | translate">
    <div class="main-menu__identity">
      <app-button
        variant="text"
        class="main-menu__user-name"
        routerLink="/user-preferences"
        [ariaLabel]="user.fullName"
        [title]="user.fullName"
      >
        <span aria-hidden="true">{{ user.fullName }}</span>
      </app-button>
    </div>

    <div class="main-menu__actions">
      <app-button
        variant="text"
        icon
        class="main-menu__icon-button"
        routerLink="/clock"
        [ariaLabel]="'navigation.clock' | translate"
        [title]="'navigation.clock' | translate"
      >
        <span aria-hidden="true"><fa-icon [icon]="faUserClock"></fa-icon></span>
      </app-button>

      <app-button
        variant="text"
        icon
        class="main-menu__icon-button"
        routerLink="/timelogs"
        [ariaLabel]="'navigation.timelogs' | translate"
        [title]="'navigation.timelogs' | translate"
      >
        <span aria-hidden="true"><fa-icon [icon]="faClock"></fa-icon></span>
      </app-button>

      <app-button
        variant="text"
        icon
        class="main-menu__icon-button"
        routerLink="/worksites"
        [ariaLabel]="'navigation.worksites' | translate"
        [title]="'navigation.worksites' | translate"
      >
        <span aria-hidden="true"><fa-icon [icon]="faBuilding"></fa-icon></span>
      </app-button>

      <app-button
        variant="text"
        icon
        class="main-menu__icon-button"
        routerLink="/schedules"
        [ariaLabel]="'navigation.schedules' | translate"
        [title]="'navigation.schedules' | translate"
      >
        <span aria-hidden="true"><fa-icon [icon]="faCalendarDays"></fa-icon></span>
      </app-button>

      @if (user.isAdmin) {
        <app-button
          variant="text"
          icon
          class="main-menu__icon-button"
          routerLink="/application-settings"
          [ariaLabel]="'navigation.applicationSettings' | translate"
          [title]="'navigation.applicationSettings' | translate"
        >
          <span aria-hidden="true"><fa-icon [icon]="faGear"></fa-icon></span>
        </app-button>
      }

      <app-button
        type="button"
        variant="text"
        icon
        class="main-menu__icon-button main-menu__icon-button--logout"
        [ariaLabel]="'actions.logout' | translate"
        [title]="'actions.logout' | translate"
        (clicked)="logout()"
      >
        <span aria-hidden="true"><fa-icon [icon]="faPowerOff"></fa-icon></span>
      </app-button>
    </div>
  </nav>
}
