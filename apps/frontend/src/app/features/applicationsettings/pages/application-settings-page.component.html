<app-page-template appNameKey="navigation.janus" pageNameKey="navigation.applicationSettings">
  <div pageContent class="app-page-content application-settings__content">
    <section class="app-card settings-card">
      <div class="app-card__body settings-card__body">
        @if (loading()) {
          <app-message type="info">{{
            'applicationSettings.messages.loading' | translate
          }}</app-message>
        } @else {
          <app-form
            [form]="form"
            [save]="save"
            saveErrorKey="applicationSettings.errors.update"
            [errorKey]="errorMessage()"
            [disabled]="!isAdmin || !!errorMessage()"
            [showSave]="isAdmin"
            cancelLink="/"
            (saved)="onSaved($event)"
          >
            <app-field
              controlId="daysUntilLocked"
              [label]="'applicationSettings.fields.daysUntilLocked' | translate"
              required
            >
              <app-range-slider
                inputId="daysUntilLocked"
                [formControl]="form.controls.daysUntilLocked"
                [min]="0"
                [max]="daysUntilLockedSliderMax"
                [step]="1"
                required
              />
            </app-field>

            <app-field
              controlId="employeeWorksiteCreationAllowed"
              [label]="'applicationSettings.fields.employeeWorksiteCreationAllowed' | translate"
            >
              <app-toggle-button
                inputId="employeeWorksiteCreationAllowed"
                [formControl]="form.controls.employeeWorksiteCreationAllowed"
                ariaLabelledBy="employeeWorksiteCreationAllowed-label"
              />
            </app-field>

            <app-field
              controlId="worksiteChangeDuringShiftAllowed"
              [label]="'applicationSettings.fields.worksiteChangeDuringShiftAllowed' | translate"
            >
              <app-toggle-button
                inputId="worksiteChangeDuringShiftAllowed"
                [formControl]="form.controls.worksiteChangeDuringShiftAllowed"
                ariaLabelledBy="worksiteChangeDuringShiftAllowed-label"
              />
            </app-field>

            <app-field
              controlId="employeeManualTimeLogEntryAllowed"
              [label]="'applicationSettings.fields.employeeManualTimeLogEntryAllowed' | translate"
            >
              <app-toggle-button
                inputId="employeeManualTimeLogEntryAllowed"
                [formControl]="form.controls.employeeManualTimeLogEntryAllowed"
                ariaLabelledBy="employeeManualTimeLogEntryAllowed-label"
              />
            </app-field>

            <app-field
              controlId="default-timezone"
              [label]="'applicationSettings.fields.defaultTimezone' | translate"
              [error]="
                form.controls.defaultTimezone.touched && form.controls.defaultTimezone.invalid
                  ? ('applicationSettings.errors.invalidTimezone' | translate)
                  : ''
              "
              [invalid]="
                form.controls.defaultTimezone.touched && form.controls.defaultTimezone.invalid
              "
              required
            >
              <app-autocomplete-textbox
                appAutocompleteValueAccessor
                inputId="default-timezone"
                [formControl]="form.controls.defaultTimezone"
                [items]="timezoneSearch.items()"
                [loading]="timezoneSearch.loading()"
                [error]="timezoneSearch.error()"
                [panelOpen]="timezoneSearch.panelOpen()"
                (queryChange)="timezoneSearch.search($event)"
                [displayWith]="timezoneCatalog.displayWith"
                [valueWith]="timezoneCatalog.valueWith"
                [resolveByValue]="timezoneCatalog.resolve"
                [emptyHint]="'applicationSettings.fields.defaultTimezoneHint' | translate"
                ariaLabelledBy="default-timezone-label"
                [ariaDescribedBy]="
                  form.controls.defaultTimezone.touched && form.controls.defaultTimezone.invalid
                    ? 'default-timezone-error'
                    : null
                "
                [ariaInvalid]="
                  form.controls.defaultTimezone.touched && form.controls.defaultTimezone.invalid
                "
              />
            </app-field>
          </app-form>
        }
      </div>
    </section>
  </div>
</app-page-template>
