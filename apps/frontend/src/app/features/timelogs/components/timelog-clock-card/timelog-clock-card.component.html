<section class="app-card clock-in-card" [attr.aria-labelledby]="titleElementId">
  <h2 [id]="titleElementId" class="app-card__title clock-in-card__title app-visually-hidden">
    {{ 'timelog.timeTracking' | translate }}
  </h2>

  <div class="app-card__body clock-in-card__body">
    <p class="clock-in-card__clock-in">
      {{ clockActionTitleKey() | translate }}
    </p>

    <app-clock
      class="clock-in-card__clock"
      [locale]="locale()"
      [use12Hour]="use12Hour()"
    ></app-clock>

    @if (hasClockInOutPermission()) {
      <app-button [disabled]="isClockActionLoading()" (clicked)="onClockAction()">
        {{ clockActionLabelKey() | translate }}
      </app-button>
    }

    @if (clockActionFeedbackKey(); as feedbackKey) {
      <p class="clock-in-card__clock-action-feedback" role="status" aria-live="polite">
        {{ feedbackKey | translate }}
      </p>
    }
  </div>

  <footer class="app-card__footer clock-in-card__footer">
    @if (hasClockInOutPermission()) {
      <button
        type="button"
        class="clock-in-card__secondary-action"
        [disabled]="isClockActionLoading()"
        (click)="onOppositeClockAction()"
      >
        {{ oppositeClockActionLabelKey() | translate }}
        <span class="clock-in-card__icon">
          <fa-icon [icon]="faAngleRight"></fa-icon>
        </span>
      </button>
    }
  </footer>
</section>
