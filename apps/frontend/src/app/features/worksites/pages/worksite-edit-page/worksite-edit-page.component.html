<app-page-template appNameKey="navigation.janus" pageNameKey="worksite.edit">
  <div pageContent class="app-page-content worksite-create-content">
    <section class="app-card worksites-card">
      <div class="app-card__body worksites-card__body">
        <app-async-state [loading]="loading()" [error]="worksiteResource.error()" [retry]="retryLoad">
          <ng-template appAsyncLoading>{{ 'worksite.detailLoading' | translate }}</ng-template>
          <ng-template appAsyncError>{{ 'worksite.detailLoadError' | translate }}</ng-template>
        </app-async-state>
        @if (!loading() && !worksiteResource.error() && worksite()) {
          <app-worksite-form
            editMode
            [worksite]="worksite()"
            [save]="save"
            saveErrorKey="worksite.errors.update"
            [disabled]="loading() || !!errorMessage()"
            (saved)="onSaved($event)"
            (cancelled)="cancel()"
          />
        } @else {
          <app-button variant="secondary" (clicked)="cancel()">
            {{ 'actions.cancel' | translate }}
          </app-button>
        }
      </div>
    </section>
  </div>
</app-page-template>
