<app-page-template appNameKey="navigation.janus" pageNameKey="employee.new">
  <div pageContent class="app-page-content">
    <section class="app-card">
      <div class="app-card__body">
        <app-employee-form
          [save]="save"
          [saveErrorKey]="saveErrorKey"
          cancelLink="/employees"
          (saved)="onSaved()"
        />
      </div>
    </section>
  </div>
</app-page-template>
