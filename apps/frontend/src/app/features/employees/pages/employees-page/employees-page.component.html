<app-page-template appNameKey="navigation.janus" pageNameKey="navigation.employees">
  <div pageContent class="app-page-content app-list-page">
    <div class="app-list-page__toolbar">
      <app-search-bar
        [query]="query()"
        placeholderKey="employee.search.placeholder"
        helpTextKey="employee.search.helpText"
        (queryChange)="onQueryChange($event)"
      />
      <app-button variant="main" routerLink="/employees/new">
        {{ 'actions.new' | translate }}
      </app-button>
    </div>
    <app-employee-table
      class="app-list-page__results"
      [query]="query()"
      [page]="page()"
      (pageChange)="onPageChange($event)"
    />
  </div>
</app-page-template>
