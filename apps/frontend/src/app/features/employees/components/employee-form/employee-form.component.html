<app-form
  [form]="form"
  [saveDisabled]="schedulesLoading() || !!schedulesError()"
  [save]="submit"
  [saveErrorKey]="saveErrorKey()"
  [cancelLink]="cancelLink()"
  (saved)="saved.emit($event)"
>
  <app-field
    controlId="employee-number"
    [label]="'employee.employeeNumber' | translate"
    [hint]="employeeNumberHintKey | translate"
    [error]="fieldErrorKey('employeeNumber') | translate"
    [invalid]="isInvalid('employeeNumber')"
    [disabled]="form.controls.employeeNumber.disabled"
    [required]="!form.controls.employeeNumber.disabled"
  >
    <app-input
      inputId="employee-number"
      [formControl]="form.controls.employeeNumber"
      autocomplete="off"
      ariaLabelledBy="employee-number-label"
      [ariaDescribedBy]="fieldDescribedBy('employeeNumber')"
      [ariaInvalid]="isInvalid('employeeNumber')"
      [ariaErrorMessage]="fieldErrorId('employeeNumber')"
      [required]="!form.controls.employeeNumber.disabled"
    />
  </app-field>

  <app-field
    controlId="employee-name"
    [label]="'employee.name' | translate"
    [error]="fieldErrorKey('name') | translate"
    [invalid]="isInvalid('name')"
    [disabled]="form.controls.name.disabled"
    required
  >
    <app-input
      inputId="employee-name"
      [formControl]="form.controls.name"
      autocomplete="given-name"
      ariaLabelledBy="employee-name-label"
      [ariaDescribedBy]="fieldDescribedBy('name')"
      [ariaInvalid]="isInvalid('name')"
      [ariaErrorMessage]="fieldErrorId('name')"
      required
    />
  </app-field>

  <app-field
    controlId="employee-surname"
    [label]="'employee.surname' | translate"
    [error]="fieldErrorKey('surname') | translate"
    [invalid]="isInvalid('surname')"
    [disabled]="form.controls.surname.disabled"
    required
  >
    <app-input
      inputId="employee-surname"
      [formControl]="form.controls.surname"
      autocomplete="family-name"
      ariaLabelledBy="employee-surname-label"
      [ariaDescribedBy]="fieldDescribedBy('surname')"
      [ariaInvalid]="isInvalid('surname')"
      [ariaErrorMessage]="fieldErrorId('surname')"
      required
    />
  </app-field>

  <app-field
    controlId="employee-email"
    [label]="'employee.email' | translate"
    [error]="fieldErrorKey('email') | translate"
    [invalid]="isInvalid('email')"
    [disabled]="form.controls.email.disabled"
    required
  >
    <app-input
      inputId="employee-email"
      [formControl]="form.controls.email"
      type="email"
      autocomplete="email"
      ariaLabelledBy="employee-email-label"
      [ariaDescribedBy]="fieldDescribedBy('email')"
      [ariaInvalid]="isInvalid('email')"
      [ariaErrorMessage]="fieldErrorId('email')"
      required
    />
  </app-field>

  <app-field
    controlId="employee-schedule"
    [label]="'employee.schedule' | translate"
    [error]="fieldErrorKey('schedule') | translate"
    [invalid]="isInvalid('schedule')"
    required
  >
    <app-select
      inputId="employee-schedule"
      [formControl]="form.controls.schedule"
      [options]="scheduleOptions()"
      [ariaDescribedBy]="fieldDescribedBy('schedule')"
      [ariaInvalid]="isInvalid('schedule')"
      required
    />
    <app-async-state
      [loading]="schedulesLoading()"
      [error]="schedulesError()"
      [empty]="scheduleOptions().length === 1"
      [retry]="loadSchedules"
    >
      <ng-template appAsyncLoading>{{ 'schedule.loading' | translate }}</ng-template>
      <ng-template appAsyncError>{{ 'schedule.loadError' | translate }}</ng-template>
      <ng-template appAsyncEmpty>{{ 'schedule.empty' | translate }}</ng-template>
    </app-async-state>
  </app-field>
</app-form>
