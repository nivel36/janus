apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "janus.fullname" . }}-keycloak-realm
  namespace: {{ include "janus.namespace" . }}
  labels:
    {{- include "janus.labels" . | nindent 4 }}
data:
  realm-export.json: |
{{ .Files.Get "files/realm-export.json" | indent 4 }}
  reconcile-keycloak-realm.sh: |
{{ .Files.Get "files/reconcile-keycloak-realm.sh" | indent 4 }}
